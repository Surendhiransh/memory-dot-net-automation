name: Oracle memory spec tests

on:
  push:
    branches: [main]
    paths: ["Oracle/**", ".github/workflows/oracle-tests.yml"]
  pull_request:
    paths: ["Oracle/**", ".github/workflows/oracle-tests.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: Oracle

jobs:
  test:
    # Windows matches the environment the tests and PDF text extraction were verified on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Oracle/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # CSV-dependent tests skip themselves when the (uncommitted) source CSV is absent.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compare CSV with datasheets
        if: hashFiles('Oracle/oracle_host_memory_specification*.csv') != ''
        run: python compare_memory_specs.py --out-dir ci-output

      - name: Upload comparison report
        if: always() && hashFiles('Oracle/ci-output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: oracle-memory-spec-comparison
          path: Oracle/ci-output/
